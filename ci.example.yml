name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Шаблон: удалённый run не выполнялся, защита merge не настроена. Локальный эквивалент: make check-fast.
      - run: python -m compileall -q release.py lab.py service.py api_contract.py app flows tests tests_integration
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests_integration -t . -v
      # Веса и torch не нужны: Prefect и FastAPI проверяются со StubBackend.
      - run: pip install -r requirements-fast.txt
      - run: python -m unittest discover -s tests_integration -t . -v
        env:
          HW_LAB_CMD: -m flows.release_flow
          HW_SERVICE_CMD: -m app.api
